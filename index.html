<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>토토 판매점 지도</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f6f7f5; --panel:#ffffff; --ink:#15201a; --sub:#5d6b63; --line:#e3e8e4;
  --brand:#0f7a45; --brand-ink:#ffffff; --accent:#ff5a36; --chip:#eef4f0;
  --shadow:0 6px 24px rgba(10,30,20,.14);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0e1411;--panel:#17201b;--ink:#e8efe9;--sub:#9aa9a0;--line:#26332c;--chip:#1f2b25;--shadow:0 6px 24px rgba(0,0,0,.5)}
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent}
#map{position:fixed;inset:0}

/* top search */
.top{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(env(safe-area-inset-top) + 12px) 12px 0;pointer-events:none}
.search{pointer-events:auto;display:flex;gap:8px;max-width:560px;margin:0 auto}
.box{flex:1;display:flex;align-items:center;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:0 6px 0 14px;height:50px}
.box svg{flex:none;color:var(--sub)}
.box input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:500 16px Pretendard,sans-serif;padding:0 10px;min-width:0}
.box button{border:0;background:var(--brand);color:var(--brand-ink);font:600 15px Pretendard,sans-serif;height:38px;padding:0 14px;border-radius:10px;cursor:pointer}
.sugg{pointer-events:auto;max-width:560px;margin:6px auto 0;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:none}
.sugg.on{display:block}
.sugg button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:12px 16px;border-bottom:1px solid var(--line);font:500 15px Pretendard,sans-serif;cursor:pointer}
.sugg button:last-child{border-bottom:0}
.sugg small{display:block;color:var(--sub);font-size:12px;margin-top:2px;font-weight:400}

.chips{pointer-events:auto;display:flex;gap:6px;max-width:560px;margin:8px auto 0;flex-wrap:wrap}
.chip{border:0;background:var(--panel);color:var(--ink);box-shadow:var(--shadow);border-radius:999px;height:34px;padding:0 13px;font:600 13px Pretendard,sans-serif;cursor:pointer;display:flex;align-items:center;gap:5px}
.chip.on{background:var(--brand);color:var(--brand-ink)}

/* floating buttons */
.fab{position:fixed;right:12px;z-index:15;width:48px;height:48px;border-radius:50%;border:0;background:var(--panel);color:var(--brand);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer}
#locate{bottom:calc(var(--sheet-h,150px) + 16px)}
#locate.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* bottom sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:18;background:var(--panel);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.12);max-width:640px;margin:0 auto;display:flex;flex-direction:column;height:150px;transition:height .25s ease;padding-bottom:env(safe-area-inset-bottom)}
.sheet.open{height:62vh}
.grab{padding:10px 16px 8px;cursor:pointer;flex:none}
.grab i{display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.head b{font-size:17px;font-weight:700}
.head span{font-size:13px;color:var(--sub)}
.list{overflow-y:auto;flex:1;padding:0 8px 12px}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item .d{flex:none;min-width:54px;text-align:center;background:var(--chip);color:var(--brand);border-radius:8px;font:700 13px Pretendard,sans-serif;padding:6px 4px}
.item .t{flex:1;min-width:0}
.item .n{font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center}
.item .a{color:var(--sub);font-size:13px;margin-top:2px;line-height:1.35}
.tag{font-size:11px;font-weight:600;color:var(--brand);border:1px solid var(--brand);border-radius:5px;padding:1px 5px;flex:none}
.item .go{flex:none;align-self:center;font:600 12px Pretendard,sans-serif;color:var(--brand);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.empty{color:var(--sub);font-size:14px;padding:18px 8px;line-height:1.5}

/* info bubble on map */
.bubble{background:#fff;color:#15201a;border-radius:12px;padding:10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.2);font-family:Pretendard,sans-serif;min-width:180px;max-width:240px;position:relative;bottom:46px}
.bubble b{display:block;font-size:14px}
.bubble p{font-size:12px;color:#5d6b63;margin:3px 0 8px;line-height:1.35}
.bubble a{font-size:12px;font-weight:600;color:#0f7a45;text-decoration:none;margin-right:10px}
.bubble:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 120px);transform:translateX(-50%);background:rgba(20,30,25,.92);color:#fff;font-size:14px;padding:10px 16px;border-radius:10px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.err{position:fixed;inset:0;display:none;place-items:center;padding:24px;background:var(--bg);z-index:50;text-align:center;line-height:1.6}
.err.on{display:grid}
.err code{background:var(--chip);padding:2px 6px;border-radius:5px}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <form class="search" id="form" autocomplete="off">
    <label class="box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="강남역, 천호역, 성내동…" enterkeyhint="search">
      <button type="submit">검색</button>
    </label>
  </form>
  <div class="sugg" id="sugg"></div>
  <div class="chips" id="chips">
    <button class="chip" data-r="500">500m</button>
    <button class="chip on" data-r="1000">1km</button>
    <button class="chip" data-r="2000">2km</button>
    <button class="chip" id="smartOnly">스마트슬립만</button>
  </div>
</div>

<button class="fab" id="locate" aria-label="내 위치">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
</button>

<section class="sheet" id="sheet">
  <div class="grab" id="grab">
    <i></i>
    <div class="head"><b id="title">검색하거나 내 위치를 눌러봐</b><span id="count"></span></div>
  </div>
  <div class="list" id="list"></div>
</section>

<div class="toast" id="toast"></div>
<div class="err" id="err"><div>
  <b>지도를 불러오지 못했어요</b><br>
  카카오 개발자 사이트 → 앱 → 플랫폼 → Web 사이트 도메인에<br>지금 주소(<code id="origin"></code>)가 등록돼 있는지,<br>카카오맵 사용 설정이 켜져 있는지 확인해 주세요.
</div></div>

<script>
const $ = s => document.querySelector(s);
let map, ps, centerMarker, circle, myDot, overlay, markers = [];
let center = null, centerLabel = "", radius = 1000, smartOnly = false;

function toast(msg, ms=2200){const t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),ms)}
function dist(a,b,c,d){const R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;const h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function fmt(m){return m<1000?Math.round(m/10)*10+"m":(m/1000).toFixed(1)+"km"}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function loadSdk(){
  const s=document.createElement("script");
  s.src="https://dapi.kakao.com/v2/maps/sdk.js?appkey="+KAKAO_JS_KEY+"&libraries=services&autoload=false";
  s.onload=()=>kakao.maps.load(init);
  s.onerror=showErr;
  document.head.appendChild(s);
  setTimeout(()=>{if(!map)showErr()},8000);
}
function showErr(){$("#origin").textContent=location.origin;$("#err").classList.add("on")}

const PIN = (fill, size) => {
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size*1.3}" viewBox="0 0 30 39"><path d="M15 38s13-12.6 13-23A13 13 0 0 0 2 15c0 10.4 13 23 13 23z" fill="${fill}" stroke="#fff" stroke-width="2.5"/><circle cx="15" cy="15" r="5" fill="#fff"/></svg>`;
  return new kakao.maps.MarkerImage("data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg),new kakao.maps.Size(size,size*1.3),{offset:new kakao.maps.Point(size/2,size*1.3)});
};
let IMG_STORE, IMG_CENTER;

function init(){
  map=new kakao.maps.Map($("#map"),{center:new kakao.maps.LatLng(37.5302,127.1238),level:5});
  ps=new kakao.maps.services.Places();
  IMG_STORE=PIN("#0f7a45",28); IMG_CENTER=PIN("#ff5a36",34);
  overlay=new kakao.maps.CustomOverlay({yAnchor:1,zIndex:10});
  kakao.maps.event.addListener(map,"click",()=>overlay.setMap(null));
  // URL ?q= support
  const q=new URLSearchParams(location.search).get("q");
  if(q){$("#q").value=q;search(q)}
}

/* ---------- search ---------- */
$("#form").addEventListener("submit",e=>{e.preventDefault();const v=$("#q").value.trim();if(v)search(v);$("#q").blur()});
function search(q){
  ps.keywordSearch(q,(data,status)=>{
    if(status!==kakao.maps.services.Status.OK||!data.length){toast("‘"+q+"’ 위치를 못 찾았어요");return}
    // 역/동 이름이면 첫 결과로 바로 이동, 후보도 보여줌
    goTo(+data[0].y,+data[0].x,data[0].place_name);
    showSugg(data.slice(0,5));
  });
}
function showSugg(list){
  const box=$("#sugg");
  if(list.length<2){box.classList.remove("on");return}
  box.innerHTML=list.map((p,i)=>`<button data-i="${i}">${esc(p.place_name)}<small>${esc(p.road_address_name||p.address_name)}</small></button>`).join("");
  box.classList.add("on");
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>{const p=list[+b.dataset.i];goTo(+p.y,+p.x,p.place_name);box.classList.remove("on")});
  clearTimeout(box._h); box._h=setTimeout(()=>box.classList.remove("on"),6000);
}

/* ---------- my location ---------- */
$("#locate").addEventListener("click",()=>{
  if(!navigator.geolocation){toast("이 브라우저는 위치 기능을 지원하지 않아요");return}
  const b=$("#locate");b.classList.add("busy");
  navigator.geolocation.getCurrentPosition(p=>{
    b.classList.remove("busy");
    const {latitude:la,longitude:lo}=p.coords;
    if(myDot)myDot.setMap(null);
    myDot=new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(la,lo),content:'<div style="width:16px;height:16px;border-radius:50%;background:#2f7df6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,125,246,.25)"></div>',yAnchor:.5,xAnchor:.5});
    myDot.setMap(map);
    goTo(la,lo,"내 위치",true);
  },err=>{
    b.classList.remove("busy");
    toast(err.code===1?"위치 권한을 허용해 주세요":"현재 위치를 가져오지 못했어요");
  },{enableHighAccuracy:true,timeout:10000,maximumAge:30000});
});

/* ---------- filters ---------- */
document.querySelectorAll(".chip[data-r]").forEach(c=>c.onclick=()=>{
  document.querySelectorAll(".chip[data-r]").forEach(x=>x.classList.remove("on"));c.classList.add("on");
  radius=+c.dataset.r; if(center)render(true);
});
$("#smartOnly").onclick=e=>{smartOnly=!smartOnly;e.currentTarget.classList.toggle("on",smartOnly);if(center)render(false)};

/* ---------- core ---------- */
function goTo(lat,lng,label,isMe){
  center={lat,lng}; centerLabel=label;
  if(centerMarker)centerMarker.setMap(null);
  if(!isMe){centerMarker=new kakao.maps.Marker({position:new kakao.maps.LatLng(lat,lng),image:IMG_CENTER,zIndex:5});centerMarker.setMap(map)}
  render(true);
}
function render(fit){
  markers.forEach(m=>m.setMap(null));markers=[];overlay.setMap(null);
  if(circle)circle.setMap(null);
  const c=new kakao.maps.LatLng(center.lat,center.lng);
  circle=new kakao.maps.Circle({center:c,radius,strokeWeight:2,strokeColor:"#0f7a45",strokeOpacity:.7,strokeStyle:"dash",fillColor:"#0f7a45",fillOpacity:.07});
  circle.setMap(map);

  const near=[];
  for(const s of STORES){
    if(smartOnly&&!s[5])continue;
    const d=dist(center.lat,center.lng,s[3],s[4]);
    if(d<=radius)near.push([d,s]);
  }
  near.sort((a,b)=>a[0]-b[0]);

  near.forEach(([d,s],i)=>{
    const m=new kakao.maps.Marker({position:new kakao.maps.LatLng(s[3],s[4]),image:IMG_STORE,title:s[0]});
    m.setMap(map);kakao.maps.event.addListener(m,"click",()=>openBubble(s,d));
    markers.push(m);
  });

  if(fit){
    const lvl=radius<=500?4:radius<=1000?5:6;
    map.setLevel(lvl);map.setCenter(c);
  }
  $("#title").textContent=`${centerLabel} 반경 ${fmt(radius)}`;
  $("#count").textContent=`${near.length}곳`;
  const list=$("#list");
  if(!near.length){
    list.innerHTML=`<div class="empty">이 반경 안에는 판매점이 없어요.<br>위에서 반경을 넓혀 보세요.</div>`;
  }else{
    list.innerHTML=near.map(([d,s],i)=>`<div class="item" data-i="${i}">
      <div class="d">${fmt(d)}</div>
      <div class="t"><div class="n">${esc(s[0])}${s[5]?'<span class="tag">스마트슬립</span>':""}</div><div class="a">${esc(s[1])}</div></div>
      <a class="go" href="${route(s)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">길찾기</a>
    </div>`).join("");
    list.querySelectorAll(".item").forEach(el=>el.onclick=()=>{
      const [d,s]=near[+el.dataset.i];
      map.panTo(new kakao.maps.LatLng(s[3],s[4]));openBubble(s,d);
      $("#sheet").classList.remove("open");syncFab();
    });
  }
  list.scrollTop=0;
}
function route(s){return `https://map.kakao.com/link/to/${encodeURIComponent(s[0])},${s[3]},${s[4]}`}
function openBubble(s,d){
  overlay.setContent(`<div class="bubble"><b>${esc(s[0])}</b><p>${esc(s[1])}<br>${fmt(d)} · ${s[5]?"스마트슬립 가능":"스마트슬립 불가"}</p><a href="${route(s)}" target="_blank" rel="noopener">길찾기</a><a href="https://map.kakao.com/link/map/${encodeURIComponent(s[0])},${s[3]},${s[4]}" target="_blank" rel="noopener">카카오맵에서 보기</a></div>`);
  overlay.setPosition(new kakao.maps.LatLng(s[3],s[4]));overlay.setMap(map);
}

/* ---------- sheet ---------- */
function syncFab(){document.documentElement.style.setProperty("--sheet-h",$("#sheet").classList.contains("open")?"62vh":"150px")}
$("#grab").onclick=()=>{$("#sheet").classList.toggle("open");syncFab()};

loadSdk();
</script>
